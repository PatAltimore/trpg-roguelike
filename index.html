<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Emblem Tactics – Roguelike TRPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* html/body are pinned to exactly the visible viewport (not just
       overflow:hidden) — on mobile Safari, `100vh` alone measures the
       *largest* viewport (address bar collapsed), so the page can end up
       taller than what's actually visible and silently scroll a few
       pixels on load. That scroll offset is invisible on the map-filling
       gameplay screen but very obvious on the title screen, where the
       canvas is a small letterboxed rectangle that then reads as
       "not centered". `position: fixed` + 100% makes scrolling impossible
       regardless of which viewport height the browser measured. */
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      font-family: 'Press Start 2P', monospace;
      color: #e8e8e8;
    }
    /* the view bar sits above the playfield; the game fills what is left */
    #game-container {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      touch-action: none;
    }
    #viewbar {
      flex: 0 0 auto;
      width: 100%;           /* narrowed to the map's width by ViewBar.place() */
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      background: #0d0d24;
      border-bottom: 1px solid #2a2a5a;
    }
    #viewbar[hidden], .vb-tools[hidden] { display: none; }
    .vb-switch { display: inline-flex; border: 1px solid #5870b0; border-radius: 8px; overflow: hidden; }
    .vb-switch button {
      font: 11px 'Press Start 2P', monospace;
      padding: 10px 16px;
      border: none;
      background: #14143a;
      color: #a8baf0;
      cursor: pointer;
      touch-action: manipulation;
    }
    .vb-switch button[aria-pressed="true"] { background: #3a66ff; color: #fff; }
    .vb-tools { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    .vb-tools button {
      min-width: 36px;
      height: 36px;
      padding: 0 8px;
      border: 1px solid #3a4a80;
      border-radius: 6px;
      background: #14143a;
      color: #a8baf0;
      font: 15px system-ui, sans-serif;
      cursor: pointer;
      touch-action: manipulation;
    }
    .vb-tools button[data-tool="reset"] { font-size: 12px; }
    #viewbar button:hover { filter: brightness(1.3); }
    @media (pointer: coarse) {
      .vb-switch button { padding: 12px 18px; }
      .vb-tools button { min-width: 40px; height: 40px; }
    }
    /* phones: keep everything on one slim row */
    @media (max-width: 560px) {
      #viewbar { padding: 5px 6px; gap: 6px; }
      .vb-switch button { padding: 9px 10px; font-size: 9px; }
      .vb-tools { flex-wrap: nowrap; gap: 3px; }
      .vb-tools button { min-width: 0; width: 31px; height: 34px; padding: 0; font-size: 14px; }
      .vb-tools button[data-tool="reset"] { width: 44px; font-size: 9px; }
    }
    canvas {
      display: block;
      position: absolute;
      left: 0;
      top: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="viewbar" hidden>
    <div class="vb-switch" role="group" aria-label="Map view">
      <button data-mode="2d" aria-pressed="false">2D</button>
      <button data-mode="3d" aria-pressed="true">3D</button>
    </div>
    <div class="vb-tools" hidden>
      <button data-tool="rotLeft" title="Rotate left (Q)" aria-label="Rotate left">&#10226;</button>
      <button data-tool="rotRight" title="Rotate right (E)" aria-label="Rotate right">&#10227;</button>
      <button data-tool="tiltUp" title="Look lower" aria-label="Tilt up">&#9650;</button>
      <button data-tool="tiltDown" title="Look higher" aria-label="Tilt down">&#9660;</button>
      <button data-tool="zoomOut" title="Zoom out (-)" aria-label="Zoom out">&minus;</button>
      <button data-tool="zoomIn" title="Zoom in (+)" aria-label="Zoom in">+</button>
      <button data-tool="reset" title="Reset the camera (R)">Reset</button>
    </div>
  </div>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>
  <script type="module" src="js/game.js"></script>
</body>
</html>
